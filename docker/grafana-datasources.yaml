apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: ClickHouse
    type: clickhouse
    access: proxy
    url: http://clickhouse:8123
    database: otel
    editable: false
    jsonData:
      defaultDatabase: otel

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false