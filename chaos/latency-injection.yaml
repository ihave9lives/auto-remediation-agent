apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: latency-injection
  namespace: default
spec:
  action: latency
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: service-b
  latency:
    latency: "200ms"
    correlation: "25"
    jitter: "50ms"
  duration: "60s"
  scheduler:
    cron: "@every 5m"