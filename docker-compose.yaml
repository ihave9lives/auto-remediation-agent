version: '3.8'

services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    depends_on:
      - clickhouse
      - prometheus
      - loki
    networks:
      - observability

  # ClickHouse for traces/logs storage
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - observability

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  # Loki for logs
  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - observability

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - observability

  # Mock Service A (Python/FastAPI)
  service-a:
    build:
      context: ./mock-services/service-a
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SERVICE_NAME=service-a
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DOWNSTREAM_URL=http://service-b:8080
      - FAILURE_RATE=0.0
      - LATENCY_MS=50
    depends_on:
      - otel-collector
      - service-b
    networks:
      - observability

  # Mock Service B (Go)
  service-b:
    build:
      context: ./mock-services/service-b
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - SERVICE_NAME=service-b
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - DOWNSTREAM_URL=http://service-c:8080
      - FAILURE_RATE=0.0
      - LATENCY_MS=30
    depends_on:
      - otel-collector
      - service-c
    networks:
      - observability

  # Mock Service C (Node.js)
  service-c:
    build:
      context: ./mock-services/service-c
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      - SERVICE_NAME=service-c
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - FAILURE_RATE=0.0
      - LATENCY_MS=20
    depends_on:
      - otel-collector
    networks:
      - observability

  # Watchdog (Rust)
  watchdog:
    build:
      context: ./watchdog
      dockerfile: Dockerfile
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - CLICKHOUSE_URL=tcp://clickhouse:9000
      - CLICKHOUSE_DATABASE=otel
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - WATCHDOG_CONFIG=/config/config.toml
    volumes:
      - ./watchdog/config.toml:/config/config.toml
    depends_on:
      - prometheus
      - clickhouse
    networks:
      - observability

  # Agent (Python)
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - KUBECONFIG=/kube/config
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./agent:/app
      - ~/.kube/config:/kube/config:ro
    depends_on:
      - prometheus
      - loki
      - clickhouse
    networks:
      - observability

  # Chaos Mesh for fault injection
  chaos-mesh:
    image: chaos-mesh/chaos-mesh:2.5.0
    # In production, use chaos-mesh operator with CRDs
    # This is a placeholder for the chaos daemon
    command: ["sleep", "infinity"]
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  clickhouse_data:
  prometheus_data:
  loki_data:
  grafana_data: