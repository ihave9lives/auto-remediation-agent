[project]
name = "agent"
version = "0.1.0"
description = "Agentic Root-Cause Engine for Autonomous Remediation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "prometheus-client>=0.19",
    "kubernetes>=29.0",
    "gitpython>=3.1",
    "clickhouse-driver>=0.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.2",
    "structlog>=24.0",
    "neo4j>=5.14",
    "neo4j-graphrag>=1.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.3.0",
    "mypy>=1.9",
]